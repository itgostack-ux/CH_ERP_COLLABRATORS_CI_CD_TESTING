name: CI Pipeline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # 🔹 LINT + SEMGREP
  linter:
    name: 'Frappe Linter'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - uses: pre-commit/action@v3.0.0

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Run Semgrep rules
        run: |
          pip install semgrep
          semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness


  # 🔹 DEPENDENCY VULNERABILITY CHECK
  deps-vulnerable-check:
    name: 'Vulnerable Dependency Check'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install and run pip-audit
        run: |
          pip install pip-audit
          pip-audit --desc on .


  # 🔹 UNIT TESTING (ERPNext)
  test:
    name: 'Unit Tests (ERPNext)'
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Bench
        run: pip install frappe-bench

      - name: Init Bench
        run: |
          bench init frappe-bench --frappe-branch version-15

      - name: Setup Site & Install App
        run: |
          cd frappe-bench
          bench new-site teststackerp --admin-password admin --db-root-password root
          bench get-app testerp2 $GITHUB_WORKSPACE
          bench --site teststackerp install-app testerp2

      - name: Run Unit Tests
        run: |
          cd frappe-bench
          bench --site teststackerp run-tests --app testerp2

 
      - name: Run Coverage Check
        run: |
          cd frappe-bench/apps/testerp2
          python -m coverage report --fail-under=70
