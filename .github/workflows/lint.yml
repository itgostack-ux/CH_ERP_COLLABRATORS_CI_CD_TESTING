name: Python CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:

  # 🔹 LINT JOB
  lint:
    name: Python Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: flake8 .



  # 🔹 UNIT TEST JOB (ERPNext)
  test:
    name: Unit Tests (ERPNext)
    runs-on: ubuntu-latest
    needs: lint   # run after lint passes

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Bench
        run: pip install frappe-bench

      - name: Init Bench
        run: bench init frappe-bench --frappe-branch version-15

      - name: Setup Site & Install App
        run: |
          cd frappe-bench
          bench new-site teststackerp --admin-password admin --db-root-password root
          bench get-app testerp2 $GITHUB_WORKSPACE
          bench --site teststackerp install-app testerp2

      - name: Run Unit Tests
        run: |
          cd frappe-bench
          bench --site teststackerp run-tests --app testerp2
